<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalshi Watch</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="alternate" type="application/rss+xml" title="Kalshi Watch" href="/feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f6;
      --bg-elev: #f9fafb;
      --bg-card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-dim: #3b82f6;
      --danger: #dc2626;
      --chip: #f3f4f6;
      --ink-soft: #111827;
      --bar: #2563eb;
      --bar-weak: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font: 14px/1.4 Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      font-feature-settings: "tnum" 1, "ss01" 1;
      letter-spacing: -0.011em;
      color: var(--text);
      background: var(--bg);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }

    .bar {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 20px 12px;
      display: grid;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink-soft);
    }

    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .meta a {
      color: var(--accent);
      text-decoration: none;
    }

    .meta a:hover { text-decoration: underline; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    input[type="search"] {
      flex: 1 1 280px;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-card);
      color: var(--text);
      outline: none;
      font: inherit;
    }

    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-card);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 20px 40px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: start;
    }

    @media (min-width: 760px) {
      main {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      main > .status,
      main > .empty {
        grid-column: 1 / -1;
      }
    }

    .status, .empty {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      background: var(--bg-card);
    }

    .status.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em;
      background: var(--chip);
      padding: 1px 5px;
      border-radius: 2px;
    }

    article {
      display: grid;
      gap: 8px;
      padding: 12px 12px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-card);
      min-width: 0;
    }

    article h2 {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.3;
      color: var(--ink-soft);
    }

    .headline {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 4px 12px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .outcomes {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .outcomes li {
      display: grid;
      gap: 4px;
    }

    .outcome-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .outcome-label {
      min-width: 0;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink-soft);
    }

    .outcome-main {
      flex: 0 0 auto;
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1;
    }

    .outcome-main.is-last {
      color: var(--muted);
    }

    .outcome-main .tag {
      margin-left: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      vertical-align: middle;
    }

    .prob-track {
      height: 4px;
      border-radius: 0;
      background: var(--chip);
      overflow: hidden;
    }

    .prob-fill {
      height: 100%;
      border-radius: 0;
      background: var(--bar);
      min-width: 0;
    }

    .prob-fill.is-weak {
      background: repeating-linear-gradient(
        -45deg,
        var(--bar-weak),
        var(--bar-weak) 4px,
        color-mix(in srgb, var(--bar-weak) 65%, white) 4px,
        color-mix(in srgb, var(--bar-weak) 65%, white) 8px
      );
    }

    .prices {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      gap: 4px;
      align-items: baseline;
      padding: 1px 6px;
      border-radius: 2px;
      background: var(--chip);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--muted);
    }

    .chip b {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .chip.bid b,
    .chip.ask b { color: var(--accent); }

    .ticker-hint {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.15s ease;
      overflow-wrap: anywhere;
    }

    .outcomes li:hover .ticker-hint,
    .outcomes li:focus-within .ticker-hint {
      opacity: 1;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    details.more {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
    }

    details.more summary {
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    details.more summary::-webkit-details-marker { display: none; }

    details.more summary::after {
      content: " ▾";
      color: var(--accent);
    }

    details.more[open] summary::after { content: " ▴"; }

    .more-body {
      margin-top: 8px;
      display: grid;
      gap: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
    }

    a.market-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
    }

    a.market-link:hover { text-decoration: underline; }

    .outcomes-toggle {
      justify-self: start;
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .outcomes-toggle:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <h1 id="channel-title">Kalshi Watch</h1>
        <div class="meta" id="channel-meta">
          正在读取 <a href="/feed.xml">feed.xml</a> …
        </div>
      </div>
      <div class="controls">
        <input id="q" type="search" placeholder="搜索事件、outcome、ticker" autocomplete="off">
        <button id="reload" type="button">重新加载</button>
      </div>
    </div>
  </header>
  <main id="list"></main>
  <script>
    const FEED_URL = "/feed.xml";
    const META_RE = /^(Sub|Series|Event):\s*(.*)$/;
    const MARKET_RE = /^(.*?)\s+—\s+(.*)$/;
    const FIELD_RE = /(YES bid|YES ask|Last|24h volume|Ticker):\s*([^;]+)/g;
    const SPREAD_WEAK = 10;
    const COLLAPSED_COUNT = 3;
    const COLLAPSE_AFTER = 6;
    const THRESHOLD_RE = /^(above|below|over|under)\s+(-?\d+(?:\.\d+)?)/i;
    const BUCKET_RE = /^(-?\d+(?:\.\d+)?)\s*[–-]\s*(-?\d+(?:\.\d+)?)/;
    const TAIL_BELOW_RE = /^(-?\d+(?:\.\d+)?)\s+or\s+below/i;
    const TAIL_ABOVE_RE = /^(-?\d+(?:\.\d+)?)\s+or\s+above/i;

    const listEl = document.getElementById("list");
    const titleEl = document.getElementById("channel-title");
    const metaEl = document.getElementById("channel-meta");
    const queryEl = document.getElementById("q");

    let items = [];
    const expandedItems = new Set();

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function textOf(node, tag) {
      return node.getElementsByTagName(tag)[0]?.textContent?.trim() || "";
    }

    function parsePercent(raw) {
      if (raw == null || raw === "") return null;
      const match = String(raw).match(/-?\d+(?:\.\d+)?/);
      if (!match) return null;
      return Number(match[0]);
    }

    function parseVolume(raw) {
      if (raw == null || raw === "") return null;
      const match = String(raw).match(/-?\d+(?:\.\d+)?/);
      if (!match) return null;
      return Number(match[0]);
    }

    function formatPercent(value) {
      if (value == null || Number.isNaN(value)) return "—";
      const formatted = Number.isInteger(value) ? value.toFixed(0) : value.toFixed(1);
      return `${formatted}%`;
    }

    function formatVolume(value) {
      if (value == null || Number.isNaN(value)) return null;
      return Math.round(value).toLocaleString("en-US");
    }

    function formatJst(value) {
      if (!value) return "";
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return value;
      const stamp = parsed.toLocaleString("ja-JP", {
        timeZone: "Asia/Tokyo",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      });
      return `${stamp} JST`;
    }

    function normalizeLabel(label) {
      return String(label)
        .replace(/\s+to\s+/gi, "–")
        .replace(/\s+-\s+/g, "–")
        .trim();
    }

    function parseDetail(detail) {
      const fields = {};
      for (const match of detail.matchAll(FIELD_RE)) {
        fields[match[1]] = match[2].trim();
      }
      return {
        bid: parsePercent(fields["YES bid"]),
        ask: parsePercent(fields["YES ask"]),
        last: parsePercent(fields.Last),
        volume: parseVolume(fields["24h volume"]),
        ticker: fields.Ticker || "",
      };
    }

    function resolveProbability(market) {
      const { bid, ask, last } = market;
      const hasGoodBook =
        bid != null &&
        ask != null &&
        bid > 0 &&
        ask < 100 &&
        ask >= bid &&
        ask - bid < SPREAD_WEAK;

      if (hasGoodBook) {
        return {
          value: (bid + ask) / 2,
          kind: "mid",
          note: null,
        };
      }

      if (last != null && last > 0) {
        return {
          value: last,
          kind: "last",
          note: "Last",
        };
      }

      return {
        value: null,
        kind: "none",
        note: null,
      };
    }

    function classifyOutcome(label) {
      const text = String(label).trim();
      const threshold = THRESHOLD_RE.exec(text);
      if (threshold) {
        return {
          kind: "threshold",
          sortKey: Number(threshold[2]),
          direction: threshold[1].toLowerCase(),
        };
      }

      const bucket = BUCKET_RE.exec(text);
      if (bucket) {
        return {
          kind: "bucket",
          sortKey: Number(bucket[1]),
          end: Number(bucket[2]),
        };
      }

      const below = TAIL_BELOW_RE.exec(text);
      if (below) {
        return { kind: "bucket", sortKey: Number.NEGATIVE_INFINITY, end: Number(below[1]) };
      }

      const above = TAIL_ABOVE_RE.exec(text);
      if (above) {
        return { kind: "bucket", sortKey: Number(above[1]), end: Number.POSITIVE_INFINITY };
      }

      return { kind: "categorical", sortKey: null };
    }

    function detectEventShape(markets) {
      if (!markets.length) return "categorical";
      const kinds = new Set(markets.map((market) => market.shape.kind));
      if (kinds.size === 1 && kinds.has("threshold")) return "threshold";
      if (kinds.has("bucket") && !kinds.has("categorical")) return "bucket";
      if ([...kinds].every((kind) => kind === "bucket" || kind === "threshold")) {
        // Mixed numeric ladder still reads better in value order.
        return kinds.has("bucket") ? "bucket" : "threshold";
      }
      return "categorical";
    }

    function sortMarkets(markets) {
      const shape = detectEventShape(markets);
      const sorted = markets.slice();

      if (shape === "threshold") {
        sorted.sort((left, right) => {
          if (left.shape.sortKey !== right.shape.sortKey) {
            return left.shape.sortKey - right.shape.sortKey;
          }
          return left.label.localeCompare(right.label);
        });
        return sorted;
      }

      if (shape === "bucket") {
        sorted.sort((left, right) => {
          if (left.shape.sortKey !== right.shape.sortKey) {
            return left.shape.sortKey - right.shape.sortKey;
          }
          const leftEnd = left.shape.end ?? 0;
          const rightEnd = right.shape.end ?? 0;
          if (leftEnd !== rightEnd) return leftEnd - rightEnd;
          return left.label.localeCompare(right.label);
        });
        return sorted;
      }

      sorted.sort((left, right) => {
        const leftValue = left.probability.value ?? -1;
        const rightValue = right.probability.value ?? -1;
        if (rightValue !== leftValue) return rightValue - leftValue;
        return (right.volume || 0) - (left.volume || 0);
      });
      return sorted;
    }

    function sortByShapeKey(markets) {
      return markets.slice().sort((left, right) => {
        if (left.shape.sortKey !== right.shape.sortKey) {
          return left.shape.sortKey - right.shape.sortKey;
        }
        const leftEnd = left.shape.end ?? 0;
        const rightEnd = right.shape.end ?? 0;
        if (leftEnd !== rightEnd) return leftEnd - rightEnd;
        return left.label.localeCompare(right.label);
      });
    }

    function featuredMarkets(markets) {
      if (markets.length <= COLLAPSE_AFTER) return markets;

      const shape = detectEventShape(markets);
      if (shape === "threshold") {
        return sortByShapeKey(
          markets
            .slice()
            .sort((left, right) => (right.volume || 0) - (left.volume || 0))
            .slice(0, COLLAPSED_COUNT)
        );
      }

      if (shape === "bucket") {
        return sortByShapeKey(
          markets
            .slice()
            .sort(
              (left, right) =>
                (right.probability.value ?? -1) - (left.probability.value ?? -1)
            )
            .slice(0, COLLAPSED_COUNT)
        );
      }

      return markets;
    }

    function parseDescription(raw) {
      const fields = {};
      const markets = [];
      for (const line of raw.split(/\r?\n/)) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        const meta = META_RE.exec(trimmed);
        if (meta) {
          fields[meta[1]] = meta[2];
          continue;
        }
        const market = MARKET_RE.exec(trimmed);
        if (!market) continue;
        const label = normalizeLabel(market[1]);
        const parsed = {
          label,
          shape: classifyOutcome(label),
          ...parseDetail(market[2]),
        };
        parsed.probability = resolveProbability(parsed);
        markets.push(parsed);
      }

      return { fields, markets: sortMarkets(markets) };
    }

    function chip(label, value, className) {
      if (value == null || value === "") return "";
      return `<span class="chip ${className || ""}">${escapeHtml(label)} <b>${escapeHtml(value)}</b></span>`;
    }

    function renderOutcome(market) {
      const probability = market.probability;
      const width = Math.max(0, Math.min(100, probability.value ?? 0));
      const mainClass = probability.kind === "last" ? "outcome-main is-last" : "outcome-main";
      const fillClass = probability.kind === "last" ? "prob-fill is-weak" : "prob-fill";
      const mainText = probability.value == null
        ? "—"
        : `${formatPercent(probability.value)}${probability.note ? `<span class="tag">${escapeHtml(probability.note)}</span>` : ""}`;

      return `
        <li title="${escapeHtml(market.ticker || market.label)}">
          <div class="outcome-top">
            <span class="outcome-label">${escapeHtml(market.label)}</span>
            <span class="${mainClass}">${mainText}</span>
          </div>
          <div class="prob-track" aria-hidden="true">
            <div class="${fillClass}" style="width:${width}%"></div>
          </div>
          <div class="prices">
            ${chip("Bid", market.bid == null ? null : formatPercent(market.bid), "bid")}
            ${chip("Ask", market.ask == null ? null : formatPercent(market.ask), "ask")}
            ${chip("Vol", formatVolume(market.volume))}
          </div>
          ${market.ticker ? `<div class="ticker-hint">${escapeHtml(market.ticker)}</div>` : ""}
        </li>
      `;
    }

    function renderItem(item) {
      const { fields, markets } = parseDescription(item.description);
      const href = item.link || "https://kalshi.com/markets";
      const updated = formatJst(item.pubDate);
      const details = [
        fields.Series ? `Series ${fields.Series}` : "",
        fields.Event || item.guid ? `Event ${fields.Event || item.guid}` : "",
      ].filter(Boolean);
      const itemKey = item.guid || item.title;
      const shape = detectEventShape(markets);
      const canCollapse =
        markets.length > COLLAPSE_AFTER &&
        (shape === "bucket" || shape === "threshold");
      const isExpanded = expandedItems.has(itemKey);
      const visibleMarkets = canCollapse && !isExpanded
        ? featuredMarkets(markets)
        : markets;
      const toggleHtml = canCollapse
        ? `<button
            type="button"
            class="outcomes-toggle"
            data-expand-key="${escapeHtml(itemKey)}"
            aria-expanded="${isExpanded ? "true" : "false"}"
          >${isExpanded
            ? "Show less ▴"
            : `Show all ${markets.length} outcomes ▾`}</button>`
        : "";

      return `
        <article>
          <h2>${escapeHtml(item.title)}</h2>
          <div class="headline">
            <span>${escapeHtml(fields.Sub || "")}</span>
            <span>${updated ? `Updated ${escapeHtml(updated)}` : ""}</span>
          </div>
          ${visibleMarkets.length ? `<ul class="outcomes">${visibleMarkets.map(renderOutcome).join("")}</ul>` : ""}
          ${toggleHtml}
          <div class="footer">
            ${details.length ? `
              <details class="more">
                <summary>Details</summary>
                <div class="more-body">${details.map((line) => `<div>${escapeHtml(line)}</div>`).join("")}</div>
              </details>` : "<span></span>"}
            <a class="market-link" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">Open Kalshi ↗</a>
          </div>
        </article>
      `;
    }

    function applyFilter() {
      const needle = queryEl.value.trim().toLowerCase();
      const visible = needle
        ? items.filter((item) => item.searchText.includes(needle))
        : items;

      if (!visible.length) {
        listEl.innerHTML = `<div class="empty">没有匹配「${escapeHtml(queryEl.value)}」的事件。</div>`;
        return;
      }
      listEl.innerHTML = visible.map(renderItem).join("");
    }

    function fileProtocolHint() {
      return `当前页面是通过 <code>file://</code> 打开的，无法读取 RSS。请用 <code>uv run pywrangler dev</code> 启动本地 Worker，然后打开 <code>http://localhost:8787/</code>。`;
    }

    function scheduledTriggerHint() {
      const origin = window.location.origin;
      if (origin.includes("localhost") || origin.includes("127.0.0.1")) {
        return `<p>本地可先生成再写入 KV：</p><code>uv run python kalshi_rss.py && uv run pywrangler kv key put feed.xml --path=feed.xml --binding=RSS_KV</code>`;
      }
      return `<p>Feed 由 GitHub Actions「Refresh Feed」每小时的第 7、37 分钟更新；也可在 Actions 里手动 Run workflow。</p>`;
    }

    function renderPendingFeed() {
      listEl.innerHTML = `
        <div class="status">
          <p>RSS 尚未生成。Worker 的 KV 里还没有 <code>feed.xml</code>。</p>
          ${scheduledTriggerHint()}
        </div>`;
      metaEl.innerHTML = `等待首次生成 · <a href="${FEED_URL}">feed.xml</a>`;
    }

    async function loadFeed() {
      listEl.innerHTML = `<div class="status">正在读取 <code>${escapeHtml(FEED_URL)}</code> …</div>`;
      metaEl.innerHTML = `正在读取 <a href="${FEED_URL}">feed.xml</a> …`;

      try {
        const response = await fetch(FEED_URL, { cache: "no-store" });
        if (response.status === 503) {
          renderPendingFeed();
          return;
        }
        if (!response.ok) {
          throw new Error(`无法读取 ${FEED_URL}（HTTP ${response.status}）`);
        }

        const xml = new DOMParser().parseFromString(await response.text(), "application/xml");
        if (xml.querySelector("parsererror")) {
          throw new Error(`${FEED_URL} 不是有效的 XML`);
        }

        const channel = xml.querySelector("channel");
        if (!channel) throw new Error("RSS 缺少 channel");

        titleEl.textContent = textOf(channel, "title") || "Kalshi Watch";
        const description = textOf(channel, "description");
        const itemNodes = [...channel.getElementsByTagName("item")];

        items = itemNodes.map((node) => {
          const title = textOf(node, "title") || "(untitled)";
          const descriptionText = textOf(node, "description");
          const guid = textOf(node, "guid");
          const pubDate = textOf(node, "pubDate");
          const link = textOf(node, "link");
          return {
            title,
            description: descriptionText,
            guid,
            pubDate,
            link,
            searchText: [title, descriptionText, guid, pubDate].join("\n").toLowerCase(),
          };
        });

        metaEl.innerHTML = [
          description,
          `${items.length} 条事件`,
          `<a href="${FEED_URL}">RSS</a>`,
        ].filter(Boolean).join(" · ");

        if (!items.length) {
          listEl.innerHTML = `<div class="empty">feed 里没有匹配的事件。检查 Worker 配置中的 keywords。</div>`;
          return;
        }

        applyFilter();
      } catch (error) {
        const hint = window.location.protocol === "file:" ? `<p>${fileProtocolHint()}</p>` : "";
        listEl.innerHTML = `<div class="status error"><p>${escapeHtml(error.message)}</p>${hint}</div>`;
        metaEl.innerHTML = `读取失败 · <a href="${FEED_URL}">feed.xml</a>`;
      }
    }

    queryEl.addEventListener("input", applyFilter);
    document.getElementById("reload").addEventListener("click", () => {
      queryEl.value = "";
      expandedItems.clear();
      loadFeed();
    });
    listEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-expand-key]");
      if (!button) return;
      const key = button.getAttribute("data-expand-key");
      if (!key) return;
      if (expandedItems.has(key)) expandedItems.delete(key);
      else expandedItems.add(key);
      applyFilter();
    });

    loadFeed();
  </script>
</body>
</html>
